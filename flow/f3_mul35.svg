<svg xmlns="http://www.w3.org/2000/svg" width="700" height="620" font-family="PingFang SC, Heiti SC, Microsoft YaHei, sans-serif" font-size="16">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="620" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">图3  1-100之间3和5的倍数之和 程序流程图</text>
  <text x="20" y="58" fill="#c00000">张三+25080808</text>

  <rect x="300" y="76" width="100" height="40" rx="20" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="101" text-anchor="middle">开始</text>
  <line x1="350" y1="116" x2="350" y2="146" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="270" y="146" width="160" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="173" text-anchor="middle">i=1, sum=0</text>
  <line x1="350" y1="190" x2="350" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="350,220 450,260 350,300 250,260" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="266" text-anchor="middle" font-size="14">i能同时被3和5整除?</text>

  <text x="360" y="318" font-size="14">是</text>
  <line x1="350" y1="300" x2="350" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="270" y="330" width="160" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="357" text-anchor="middle">sum=sum+i</text>
  <line x1="350" y1="374" x2="350" y2="404" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="270" y="404" width="160" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="431" text-anchor="middle">i=i+1</text>
  <path d="M350,448 L350,462 L180,462 L180,260 L250,260" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="462" y="252" font-size="14">否</text>
  <path d="M450,260 L560,260 L560,492 L424,492" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <polygon points="290,470 430,470 410,514 270,514" fill="#e8f4ff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="497" text-anchor="middle">输出 sum</text>
  <line x1="350" y1="514" x2="350" y2="544" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <rect x="300" y="544" width="100" height="40" rx="20" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="569" text-anchor="middle">结束</text>
</svg>
