<svg xmlns="http://www.w3.org/2000/svg" width="700" height="700" font-family="PingFang SC, Heiti SC, Microsoft YaHei, sans-serif" font-size="16">
  <defs>
    <marker id="ar" markerWidth="10" markerHeight="8" refX="9" refY="3" orient="auto">
      <path d="M0,0 L9,3 L0,6 z" fill="#333"/>
    </marker>
  </defs>
  <rect width="700" height="700" fill="#ffffff"/>
  <text x="20" y="32" font-size="20" font-weight="bold">图4  app登录验证 流程图</text>
  <text x="20" y="58" fill="#c00000">张三+25080808</text>

  <rect x="300" y="76" width="100" height="40" rx="20" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="101" text-anchor="middle">开始</text>
  <line x1="350" y1="116" x2="350" y2="146" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="290,146 430,146 410,190 270,190" fill="#e8f4ff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="173" text-anchor="middle">输入账号和密码</text>
  <line x1="350" y1="190" x2="350" y2="220" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="350,220 440,260 350,300 260,260" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="266" text-anchor="middle" font-size="15">验证正确?</text>

  <text x="360" y="318" font-size="14">是</text>
  <line x1="350" y1="300" x2="350" y2="330" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="270" y="330" width="160" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="357" text-anchor="middle">登录成功进主页</text>
  <line x1="350" y1="374" x2="350" y2="404" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="300" y="404" width="100" height="40" rx="20" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="350" y="429" text-anchor="middle">结束</text>

  <text x="452" y="252" font-size="14">否</text>
  <path d="M440,260 L540,260 L540,360" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="360" width="140" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="387" text-anchor="middle">次数=次数+1</text>
  <line x1="540" y1="404" x2="540" y2="434" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <polygon points="540,434 620,474 540,514 460,474" fill="#fffbe8" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="480" text-anchor="middle" font-size="15">次数&lt;3?</text>

  <text x="210" y="466" font-size="14">是</text>
  <path d="M460,474 L200,474 L200,168 L276,168" fill="none" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>

  <text x="552" y="532" font-size="14">否</text>
  <line x1="540" y1="514" x2="540" y2="544" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="470" y="544" width="140" height="44" fill="#ffffff" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="571" text-anchor="middle">锁定账号</text>
  <line x1="540" y1="588" x2="540" y2="618" stroke="#333" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="490" y="618" width="100" height="40" rx="20" fill="#f0f0f0" stroke="#333" stroke-width="1.5"/>
  <text x="540" y="643" text-anchor="middle">结束</text>
</svg>
